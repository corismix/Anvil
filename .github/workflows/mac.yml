name: Mac

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS 26)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM and Codex vendor build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-26-build-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-build-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            macos-26-build-${{ github.repository }}-

      - name: Build app (debug, ad hoc signed)
        run: script/build.sh

      - name: Zip app
        run: |
          mkdir -p dist/artifacts
          ditto -c -k --keepParent dist/debug/Anvil.app dist/artifacts/Anvil-macos-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Anvil-macOS-arm64
          path: dist/artifacts/Anvil-macos-arm64.zip
          retention-days: 14

      - name: Run tests
        run: script/test.sh
